global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hydra-pay
    environment: development

scrape_configs:
  - job_name: 'hydra-pay-service'
    static_configs:
      - targets: ['pay-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'
